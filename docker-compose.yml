version: '3.8'

services:
  # 1. Python RAG Servisi
  rag-service:
    build:
      context: ./ChromaDB
      dockerfile: Dockerfile
    container_name: chatbot_rag
    ports:
      - "8000:8000"
    volumes:
      - ./ChromaDB/chroma_db_abone:/app/chroma_db_abone
    restart: unless-stopped

  # 2. Spring Boot Backend
  backend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chatbot_backend
    ports:
      - "8080:8080"
    environment:
      - RAG_SERVICE_URL=http://rag-service:8000/api/rag/sor
    depends_on:
      - rag-service
    restart: unless-stopped