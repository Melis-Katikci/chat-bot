# PostgreSQL Veritabanı Bağlantı Ayarları
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=

# Driver Ayarı
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Ayarları
# Otomatik şema senkronizasyonu için 'update' olarak güncellendi
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SMTP Sunucu (Gmail) Ayarları 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sizin_epostaniz@gmail.com
spring.mail.password=smtp_uygulama_sifreniz

# SMTP Güvenlik ve Kimlik Doğrulama Ayarları
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true